# coturn in shared-secret mode.
#
# No accounts exist anywhere: the API mints a username/password pair per session, signed with the
# secret below (see apps/dotcom/server/src/presence/iceServers.ts). coturn checks the signature and
# the embedded expiry, so a credential that leaks stops working on its own and nothing has to be
# revoked.
#
# `static-auth-secret` here and `TURN_AUTH=secret:<the same value>` on the API must match exactly.

use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SHARED_SECRET

# Your domain. Used in the digest realm; it does not have to resolve to this host, but keeping it
# the same as the site's name is one less thing to explain later.
realm=example.com

listening-port=3478
# TLS on the HTTPS port. This is the single route that survives a genuinely restrictive network —
# to a firewall it is indistinguishable from ordinary web traffic. Do not drop it to save a port.
tls-listening-port=443

# The public address clients should be told to send to. Required whenever the relay is behind NAT
# (most cloud VMs); without it coturn advertises the private address and every relayed candidate is
# unreachable. Set `external-ip=PUBLIC_IP/PRIVATE_IP` in that case.
external-ip=REPLACE_WITH_PUBLIC_IP

# The certificate for turns:. Caddy already holds one for the site; point these at its copy, or at
# a certbot one. The path inside Caddy's data volume is
# /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/<your domain>/
cert=/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/example.com/example.com.crt
pkey=/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/example.com/example.com.key

# The range relayed media is allocated from. Every port in it must be reachable over UDP from the
# public internet, which is the requirement a container platform is most likely not to meet.
min-port=49152
max-port=65535

# A relay that will forward to anywhere is an open proxy into private networks, and an open relay
# is found and abused within days of being reachable. These are what keep it to real media.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Nothing here needs a database or the admin CLI.
no-cli
no-sqlite

# One board holds at most sixteen people, each with one allocation per peer; this is far above any
# legitimate use and well below what a single abuser would want.
user-quota=48
total-quota=1200

# stdout, so `docker logs` shows it.
log-file=stdout
