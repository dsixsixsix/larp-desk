<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8296"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#14161C"/>

  <!-- Browser A -->
  <rect x="40" y="40" width="230" height="86" rx="12" fill="#1D2028" stroke="#333846" stroke-width="1.5"/>
  <text x="155" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#F2F3F6">Browser A</text>
  <text x="155" y="90" text-anchor="middle" font-size="12" fill="#9AA1B1">Board in IndexedDB</text>
  <text x="155" y="107" text-anchor="middle" font-size="12" fill="#9AA1B1">nothing uploaded</text>

  <!-- Browser B -->
  <rect x="630" y="40" width="230" height="86" rx="12" fill="#1D2028" stroke="#333846" stroke-width="1.5"/>
  <text x="745" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#F2F3F6">Browser B</text>
  <text x="745" y="90" text-anchor="middle" font-size="12" fill="#9AA1B1">Board in IndexedDB</text>
  <text x="745" y="107" text-anchor="middle" font-size="12" fill="#9AA1B1">nothing uploaded</text>

  <!-- peer to peer audio -->
  <line x1="270" y1="83" x2="630" y2="83" stroke="#5C8CFF" stroke-width="2" stroke-dasharray="1 7" marker-end="url(#arrow-d)" marker-start="url(#arrow-d)"/>
  <rect x="358" y="60" width="184" height="24" rx="12" fill="#1C2740"/>
  <text x="450" y="76" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8FB0FF">audio, peer&#8209;to&#8209;peer</text>

  <!-- Sync worker: one room per board -->
  <rect x="230" y="210" width="440" height="96" rx="12" fill="#0055FF"/>
  <text x="450" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Sync worker</text>
  <text x="450" y="261" text-anchor="middle" font-size="12" fill="#DCE6FF">One Durable Object per board</text>
  <text x="450" y="279" text-anchor="middle" font-size="12" fill="#DCE6FF">roster + WebRTC offers / answers / ICE</text>
  <text x="450" y="297" text-anchor="middle" font-size="12" fill="#DCE6FF">— not the document</text>

  <!-- arrows browsers -> sync worker -->
  <line x1="180" y1="126" x2="330" y2="210" stroke="#7A8296" stroke-width="1.5" marker-end="url(#arrow-d)"/>
  <text x="150" y="170" font-size="11.5" fill="#9AA1B1">presence +</text>
  <text x="150" y="184" font-size="11.5" fill="#9AA1B1">signalling</text>

  <line x1="720" y1="126" x2="570" y2="210" stroke="#7A8296" stroke-width="1.5" marker-end="url(#arrow-d)"/>
  <text x="700" y="170" font-size="11.5" fill="#9AA1B1">presence +</text>
  <text x="700" y="184" font-size="11.5" fill="#9AA1B1">signalling</text>

  <!-- TURN relay -->
  <rect x="700" y="230" width="170" height="70" rx="12" fill="#1D2028" stroke="#333846" stroke-width="1.5"/>
  <text x="785" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#F2F3F6">TURN relay</text>
  <text x="785" y="274" text-anchor="middle" font-size="11.5" fill="#9AA1B1">NAT / firewall / VPN</text>
  <text x="785" y="290" text-anchor="middle" font-size="11.5" fill="#9AA1B1">fallback, incl. TLS:443</text>
  <line x1="700" y1="265" x2="450" y2="255" stroke="#7A8296" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="590" y="220" text-anchor="middle" font-size="11" fill="#7A8296">when direct fails</text>

  <!-- Directory -->
  <rect x="230" y="394" width="440" height="86" rx="12" fill="#1D2028" stroke="#5C8CFF" stroke-width="1.5"/>
  <text x="450" y="422" text-anchor="middle" font-size="14" font-weight="600" fill="#F2F3F6">Directory</text>
  <text x="450" y="443" text-anchor="middle" font-size="12" fill="#9AA1B1">One Durable Object, SQLite</text>
  <text x="450" y="461" text-anchor="middle" font-size="12" fill="#9AA1B1">accounts · invites · workspaces · boards</text>

  <line x1="450" y1="306" x2="450" y2="394" stroke="#7A8296" stroke-width="1.5" marker-end="url(#arrow-d)"/>
  <rect x="380" y="335" width="140" height="24" rx="12" fill="#23262E"/>
  <text x="450" y="351" text-anchor="middle" font-size="11.5" fill="#9AA1B1">checked on connect</text>
</svg>
