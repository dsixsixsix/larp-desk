<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow-vd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8296"/>
    </marker>
  </defs>

  <rect width="900" height="280" fill="#14161C"/>

  <!-- Mic -->
  <rect x="20" y="70" width="140" height="80" rx="12" fill="#1D2028" stroke="#333846" stroke-width="1.5"/>
  <text x="90" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#F2F3F6">Microphone</text>
  <text x="90" y="124" text-anchor="middle" font-size="11.5" fill="#9AA1B1">raw input</text>

  <!-- Browser DSP -->
  <rect x="200" y="60" width="180" height="100" rx="12" fill="#1D2028" stroke="#333846" stroke-width="1.5"/>
  <text x="290" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#F2F3F6">Browser DSP</text>
  <text x="290" y="110" text-anchor="middle" font-size="11.5" fill="#9AA1B1">echo cancellation</text>
  <text x="290" y="127" text-anchor="middle" font-size="11.5" fill="#9AA1B1">noise suppression</text>

  <!-- Gate -->
  <rect x="420" y="50" width="220" height="120" rx="12" fill="#0055FF"/>
  <text x="530" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Noise gate</text>
  <text x="530" y="101" text-anchor="middle" font-size="11.5" fill="#DCE6FF">AnalyserNode + GainNode</text>
  <text x="530" y="119" text-anchor="middle" font-size="11.5" fill="#DCE6FF">opens above threshold</text>
  <text x="530" y="136" text-anchor="middle" font-size="11.5" fill="#DCE6FF">closes after hold time below it</text>
  <text x="530" y="153" text-anchor="middle" font-size="11" fill="#B9CDFF">two thresholds — no syllable chatter</text>

  <!-- Mesh -->
  <rect x="680" y="60" width="200" height="100" rx="12" fill="#1D2028" stroke="#333846" stroke-width="1.5"/>
  <text x="780" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#F2F3F6">Peer mesh</text>
  <text x="780" y="110" text-anchor="middle" font-size="11.5" fill="#9AA1B1">direct, or via TURN</text>
  <text x="780" y="127" text-anchor="middle" font-size="11.5" fill="#9AA1B1">speaking indicator lit</text>

  <!-- arrows -->
  <line x1="160" y1="110" x2="200" y2="110" stroke="#7A8296" stroke-width="1.5" marker-end="url(#arrow-vd)"/>
  <line x1="380" y1="110" x2="420" y2="110" stroke="#7A8296" stroke-width="1.5" marker-end="url(#arrow-vd)"/>
  <line x1="640" y1="110" x2="680" y2="110" stroke="#7A8296" stroke-width="1.5" marker-end="url(#arrow-vd)"/>

  <!-- controls row -->
  <text x="90" y="200" text-anchor="middle" font-size="11.5" fill="#9AA1B1">device pick</text>
  <text x="290" y="200" text-anchor="middle" font-size="11.5" fill="#9AA1B1">input volume</text>
  <text x="530" y="200" text-anchor="middle" font-size="11.5" fill="#9AA1B1">push-to-talk / always on</text>
  <text x="780" y="200" text-anchor="middle" font-size="11.5" fill="#9AA1B1">"can I be heard" test</text>
</svg>
